services:
  # AgriScan Backend Web Service
  - type: web
    name: agriscan-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        value: mongodb+srv://ibrahimkmaids2024_db_user:12345678@cluster0.jhbbiny.mongodb.net/agriscan?retryWrites=true&w=majority&appName=Cluster0

  # AgriScan Frontend Static Site (type: web with runtime: static, no plan field)
  - type: web
    name: agriscan-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /api/*
        destination: https://agriscan-backend-3veo.onrender.com/api/*
    envVars:
      - key: VITE_API_URL
        value: https://agriscan-backend-3veo.onrender.com/api
