name: AgriScan CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Trigger production deployment to Render after all CI checks pass'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================================
  # JOB 1: Security & Repository Hygiene
  # ====================================================================
  security-and-hygiene:
    name: Security & Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no secrets, credentials, or dataset images are tracked in Git
        run: |
          echo "Checking tracked files for forbidden patterns..."
          TRACKED_FORBIDDEN=$(git ls-files | grep -iE '(\.env($|\.)|id_rsa|private_key|plantvillage|plantleafdataset)' || true)
          if [ -n "$TRACKED_FORBIDDEN" ]; then
            echo "ERROR: Forbidden files or dataset directories are tracked in Git:"
            echo "$TRACKED_FORBIDDEN"
            exit 1
          fi
          echo "✓ No secrets, credentials, or dataset directories are tracked in Git."

      - name: Verify .gitignore preserves dataset and secret ignore rules
        run: |
          echo "Validating .gitignore rules..."
          grep -q "/plantvillage dataset/" .gitignore || (echo "ERROR: .gitignore is missing /plantvillage dataset/" && exit 1)
          grep -q "/PlantLeafDataset/" .gitignore || (echo "ERROR: .gitignore is missing /PlantLeafDataset/" && exit 1)
          grep -q "\.env" .gitignore || (echo "ERROR: .gitignore is missing .env rules" && exit 1)
          echo "✓ Critical .gitignore rules verified."

      - name: Verify Model Artifact Parity (Backend vs Frontend)
        run: |
          echo "Verifying SHA256 parity between backend and frontend ONNX models..."
          BACKEND_ONNX_SHA=$(sha256sum backend/ml_models/leaf_disease_model.onnx | awk '{print $1}')
          FRONTEND_ONNX_SHA=$(sha256sum frontend/public/models/leaf_disease_model.onnx | awk '{print $1}')

          if [ "$BACKEND_ONNX_SHA" != "$FRONTEND_ONNX_SHA" ]; then
            echo "ERROR: Backend and Frontend ONNX models do not match!"
            echo "Backend SHA:  $BACKEND_ONNX_SHA"
            echo "Frontend SHA: $FRONTEND_ONNX_SHA"
            exit 1
          fi
          echo "✓ ONNX SHA256 Match: $BACKEND_ONNX_SHA"

          echo "Verifying SHA256 parity between backend and frontend disease_classes.json..."
          BACKEND_JSON_SHA=$(sha256sum backend/ml_models/disease_classes.json | awk '{print $1}')
          FRONTEND_JSON_SHA=$(sha256sum frontend/public/models/disease_classes.json | awk '{print $1}')

          if [ "$BACKEND_JSON_SHA" != "$FRONTEND_JSON_SHA" ]; then
            echo "ERROR: Backend and Frontend disease_classes.json do not match!"
            echo "Backend SHA:  $BACKEND_JSON_SHA"
            echo "Frontend SHA: $FRONTEND_JSON_SHA"
            exit 1
          fi
          echo "✓ disease_classes.json SHA256 Match: $BACKEND_JSON_SHA"

  # ====================================================================
  # JOB 2: Frontend Lint, Test & Build
  # ====================================================================
  frontend-ci:
    name: Frontend (Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install from lockfile)
        run: npm ci

      - name: Run linter (Oxlint)
        run: npm run lint

      - name: Run automated test suites (Camera Lifecycle & Mobile Navigation)
        run: npm test

      - name: Run production build (Vite)
        run: npm run build

  # ====================================================================
  # JOB 3: Backend API & End-to-End Prediction Tests
  # ====================================================================
  backend-ci:
    name: Backend (Node.js API & In-Memory E2E ML Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (clean install from lockfile)
        run: npm ci

      - name: Run Backend End-to-End Prediction Test Suite
        run: npm test

  # ====================================================================
  # JOB 4: ML Pipeline & Model Parity Validation
  # ====================================================================
  ml-pipeline-ci:
    name: ML Pipeline & Model Parity Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install lightweight CPU-optimized PyTorch wheels and dependencies in a single pass
          pip install -r ml/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Syntax & compilation check
        run: |
          python -m py_compile ml/*.py test_leaf*.py

      - name: Run ML Pipeline Unit & Parity Tests
        run: |
          python ml/test_ml_pipeline.py

      - name: Run Model & ONNX Verification
        run: |
          python ml/test_model_verification.py

      - name: Run Sample Leaf Inference Test
        run: |
          python test_leaf.py

      - name: Run Model Stability Test
        run: |
          python test_leaf_stability.py

  # ====================================================================
  # JOB 5: Continuous Delivery (Render Deployment Gate & Verification)
  # ====================================================================
  cd-deploy-render:
    name: Deploy to Render (Production)
    runs-on: ubuntu-latest
    needs:
      - security-and-hygiene
      - frontend-ci
      - backend-ci
      - ml-pipeline-ci
    if: |
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && vars.AUTO_DEPLOY_TO_RENDER == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_to_production == true)
      )
    environment:
      name: production
      url: https://agriscan-backend-3veo.onrender.com
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Deployment Configuration & Secrets
        id: check-secrets
        run: |
          echo "Validating Render deployment credentials..."
          if [ -z "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "::error::RENDER_BACKEND_DEPLOY_HOOK secret is not configured in GitHub Repository Secrets."
            echo "Please configure the deploy hook in GitHub Settings -> Secrets. See docs/DEPLOYMENT.md for details."
            exit 1
          fi
          echo "✓ Render deploy hook credential confirmed present."

      - name: Trigger Render Backend Deployment
        run: |
          echo "Triggering Render Backend deploy hook..."
          HTTP_STATUS=$(curl -s -S --max-time 30 --connect-timeout 10 -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" || true)
          echo "Deploy hook response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "202" ]; then
            echo "::error::Render backend deploy hook failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          echo "✓ Render backend deployment triggered successfully."

      - name: Trigger Render Frontend Deployment (Optional)
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render Frontend deploy hook..."
            HTTP_STATUS=$(curl -s -S --max-time 30 --connect-timeout 10 -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" || true)
            echo "Frontend deploy hook response status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ] && [ "$HTTP_STATUS" != "202" ]; then
              echo "::error::Render frontend deploy hook failed with HTTP status $HTTP_STATUS"
              exit 1
            fi
            echo "✓ Render frontend deployment triggered successfully."
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK not configured. Skipping frontend trigger."
          fi

      - name: Post-Deployment Health & Service Verification
        env:
          DEPLOY_SETTLE_TIME: 45
        run: |
          chmod +x scripts/verify_deployment.sh
          # Run non-destructive verification against backend health, public diseases, and auth guard
          # Passes expected commit hash (${{ github.sha }}) to automatically verify if exposed by backend
          ./scripts/verify_deployment.sh "https://agriscan-backend-3veo.onrender.com" "${{ secrets.RENDER_FRONTEND_URL }}" "${{ github.sha }}"
